; FUNDAMENTAL FIX - Restore from-internal context
[from-internal]
; Allow internal extension dialing
exten => _1XXX,1,NoOp(Internal call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Test extensions for basic functionality
exten => 100,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; Echo test
exten => 200,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Extensions 3333/4444 for gstreamer
exten => 3333,1,Goto(default,3333,1)
exten => 4444,1,Goto(default,4444,1)

; Extensions 5555/6666/7777/8888 for working system
exten => 5555,1,Goto(operational,5555,1)
exten => 6666,1,Goto(operational,6666,1)
exten => 7777,1,Goto(operational,7777,1)
exten => 8888,1,Goto(operational,8888,1)

; Conference extensions
exten => _999X,1,Goto(conference,${EXTEN},1)
