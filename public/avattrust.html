<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AvatTrust — The Operating System for Trusted AI Content</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    const root = document.getElementById('root');

    const navItems = ['Overview', 'Identities', 'Requests', 'Previews', 'Deals', 'Assets', 'Verification'];
    const stats = [
      ['Active Identities', '126'],
      ['Open Requests', '34'],
      ['Live Assets', '412'],
      ['Verification Checks', '1,842'],
    ];
    const approvalQueue = [
      ['Preview #204', 'Owner approval pending'],
      ['Deal #118', 'Final signoff required'],
      ['Asset #412', 'Packaging pending'],
    ];
    const recentActivity = [
      'Identity “Dr. Cohen” approved for Aesthetic Clinics',
      'Preview #204 submitted by Producer Studio North',
      'Verification flag resolved for asset AST-19302',
    ];
    const clientStats = [
      ['Active Requests', '4'],
      ['Pending Reviews', '2'],
      ['Approved Assets', '11'],
      ['Campaigns Live', '6'],
    ];
    const wizardSteps = ['Goal', 'Service', 'Audience', 'Identity', 'Channels', 'CTA', 'Review'];
    const goals = ['Lead Generation', 'Awareness', 'Retargeting', 'Trust Building'];

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    root.innerHTML = `
      <div class="min-h-screen bg-slate-50 text-slate-900">
        <div class="border-b bg-white/80 backdrop-blur">
          <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
            <div>
              <div class="text-xl font-semibold tracking-tight">AvatTrust</div>
              <div class="text-sm text-slate-500">The Operating System for Trusted AI Content</div>
            </div>
            <div class="flex items-center gap-3">
              <button class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-medium">Book Demo</button>
              <button class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-medium text-white">Request Access</button>
            </div>
          </div>
        </div>

        <div class="mx-auto grid max-w-7xl grid-cols-12 gap-6 px-6 py-8">
          <aside class="col-span-2 hidden rounded-3xl border bg-white p-4 lg:block">
            <div class="mb-4 text-xs font-semibold uppercase tracking-wide text-slate-400">Navigation</div>
            <nav class="space-y-2 text-sm">
              ${navItems.map((item, i) => `
                <div class="rounded-2xl px-3 py-2 ${i === 0 ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}">
                  ${esc(item)}
                </div>
              `).join('')}
            </nav>
          </aside>

          <main class="col-span-12 space-y-6 lg:col-span-10">
            <section class="rounded-[28px] bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 p-8 text-white shadow-2xl">
              <div class="grid gap-8 lg:grid-cols-2">
                <div>
                  <div class="mb-3 inline-flex rounded-full border border-white/20 px-3 py-1 text-xs text-blue-100">Hybrid Power UI Prototype</div>
                  <h1 class="max-w-xl text-4xl font-semibold tracking-tight">The Operating System for Trusted AI Content</h1>
                  <p class="mt-4 max-w-xl text-base text-slate-300">Control identity, approvals, production, and verification across AI media.</p>
                  <div class="mt-6 flex gap-3">
                    <button class="rounded-2xl bg-white px-5 py-3 text-sm font-semibold text-slate-900">Request Access</button>
                    <button class="rounded-2xl border border-white/20 px-5 py-3 text-sm font-semibold text-white">Book Demo</button>
                  </div>
                </div>
                <div class="grid gap-4 lg:grid-cols-2">
                  <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur">
                    <div class="text-sm text-slate-300">Verified Asset</div>
                    <div class="mt-2 text-2xl font-semibold">AST-20491</div>
                    <div class="mt-4 inline-flex rounded-full bg-emerald-500/20 px-3 py-1 text-xs text-emerald-200">Verified</div>
                  </div>
                  <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur">
                    <div class="text-sm text-slate-300">Pending Approvals</div>
                    <div class="mt-2 text-2xl font-semibold">18</div>
                    <div class="mt-4 text-xs text-slate-300">3 require owner decision today</div>
                  </div>
                  <div class="rounded-3xl border border-white/10 bg-white/10 p-5 backdrop-blur lg:col-span-2">
                    <div class="text-sm text-slate-300">Live Trust Layer</div>
                    <div class="mt-3 grid grid-cols-3 gap-3 text-sm">
                      <div class="rounded-2xl bg-white/10 p-3">Identity Control</div>
                      <div class="rounded-2xl bg-white/10 p-3">Approval Workflows</div>
                      <div class="rounded-2xl bg-white/10 p-3">Public Verification</div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
              ${stats.map(([label, value]) => `
                <div class="rounded-3xl border bg-white p-5 shadow-sm">
                  <div class="text-sm text-slate-500">${esc(label)}</div>
                  <div class="mt-2 text-3xl font-semibold tracking-tight">${esc(value)}</div>
                </div>
              `).join('')}
            </section>

            <section class="grid gap-6 xl:grid-cols-3">
              <div class="rounded-3xl border bg-white p-6 shadow-sm xl:col-span-2">
                <div class="mb-5 flex items-center justify-between">
                  <div>
                    <h2 class="text-lg font-semibold">Admin Dashboard</h2>
                    <p class="text-sm text-slate-500">Hybrid Power Cockpit</p>
                  </div>
                  <button class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-medium text-white">+ Create</button>
                </div>
                <div class="grid gap-4 md:grid-cols-2">
                  <div class="rounded-2xl bg-slate-50 p-4">
                    <div class="mb-3 text-sm font-medium">Approval Queue</div>
                    <div class="space-y-3">
                      ${approvalQueue.map(([title, status]) => `
                        <div class="rounded-2xl border bg-white p-3">
                          <div class="font-medium">${esc(title)}</div>
                          <div class="text-sm text-slate-500">${esc(status)}</div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                  <div class="rounded-2xl bg-slate-50 p-4">
                    <div class="mb-3 text-sm font-medium">Recent Activity</div>
                    <div class="space-y-3 text-sm text-slate-600">
                      ${recentActivity.map((line) => `
                        <div class="rounded-2xl border bg-white p-3">${esc(line)}</div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              </div>

              <div class="rounded-3xl border bg-white p-6 shadow-sm">
                <div class="mb-4">
                  <h2 class="text-lg font-semibold">Verification</h2>
                  <p class="text-sm text-slate-500">Public trust lookup</p>
                </div>
                <div class="rounded-2xl bg-slate-50 p-4">
                  <label class="mb-2 block text-sm font-medium">Asset ID</label>
                  <input
                    value="AST-20491"
                    class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none"
                  />
                  <button class="mt-3 w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-medium text-white">Verify Asset</button>
                </div>
                <div class="mt-4 rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
                  <div class="mb-2 inline-flex rounded-full bg-emerald-100 px-3 py-1 text-xs font-medium text-emerald-700">Verified</div>
                  <div class="font-semibold">Approved Asset</div>
                  <div class="mt-1 text-sm text-slate-600">Issued by AvatTrust for approved channels: Meta, Instagram, YouTube.</div>
                </div>
              </div>
            </section>

            <section class="grid gap-6 xl:grid-cols-2">
              <div class="rounded-3xl border bg-white p-6 shadow-sm">
                <div class="mb-5 flex items-center justify-between">
                  <div>
                    <h2 class="text-lg font-semibold">Client Dashboard</h2>
                    <p class="text-sm text-slate-500">Hybrid Growth Cockpit</p>
                  </div>
                  <button class="rounded-2xl bg-blue-600 px-4 py-2 text-sm font-medium text-white">+ New Request</button>
                </div>
                <div class="grid gap-4 md:grid-cols-4">
                  ${clientStats.map(([label, value]) => `
                    <div class="rounded-2xl bg-slate-50 p-4">
                      <div class="text-xs text-slate-500">${esc(label)}</div>
                      <div class="mt-2 text-2xl font-semibold">${esc(value)}</div>
                    </div>
                  `).join('')}
                </div>
                <div class="mt-5 grid gap-4 md:grid-cols-2">
                  <div class="rounded-2xl border bg-slate-50 p-4">
                    <div class="mb-3 text-sm font-medium">Content Pipeline</div>
                    <div class="space-y-2 text-sm text-slate-600">
                      <div>Request → Preview → Approved → Live</div>
                      <div class="rounded-xl bg-white p-3">Preview #204 awaiting your review</div>
                      <div class="rounded-xl bg-white p-3">Asset AST-20491 ready for Meta launch</div>
                    </div>
                  </div>
                  <div class="rounded-2xl border bg-slate-50 p-4">
                    <div class="mb-3 text-sm font-medium">Recommended Next Action</div>
                    <div class="rounded-xl bg-white p-3 text-sm text-slate-600">Review your pending preview to keep campaign delivery on track.</div>
                  </div>
                </div>
              </div>

              <div class="rounded-3xl border bg-white p-6 shadow-sm">
                <div class="mb-5">
                  <h2 class="text-lg font-semibold">New Request Wizard</h2>
                  <p class="text-sm text-slate-500">Hybrid Smart Conversion Flow</p>
                </div>
                <div class="mb-5 flex flex-wrap gap-2 text-xs">
                  ${wizardSteps.map((step, i) => `
                    <div class="rounded-full px-3 py-1 ${i === 0 ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">
                      ${i + 1}. ${esc(step)}
                    </div>
                  `).join('')}
                </div>
                <div class="grid gap-4 lg:grid-cols-[1.5fr,1fr]">
                  <div class="space-y-4">
                    <div>
                      <label class="mb-2 block text-sm font-medium">What is your goal?</label>
                      <div class="grid gap-3 sm:grid-cols-2">
                        ${goals.map((goal, i) => `
                          <div class="rounded-2xl border p-4 text-sm ${i === 0 ? 'border-blue-600 bg-blue-50' : 'bg-white'}">
                            ${esc(goal)}
                          </div>
                        `).join('')}
                      </div>
                    </div>
                    <div>
                      <label class="mb-2 block text-sm font-medium">Service / Offer</label>
                      <input class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm" placeholder="e.g. Consultation for natural Botox treatment" />
                    </div>
                    <div>
                      <label class="mb-2 block text-sm font-medium">Primary CTA</label>
                      <input class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm" placeholder="Book consultation" />
                    </div>
                  </div>
                  <div class="rounded-3xl bg-slate-50 p-4">
                    <div class="mb-3 text-sm font-medium">Live Summary</div>
                    <div class="space-y-3 text-sm text-slate-600">
                      <div class="rounded-xl bg-white p-3">Goal: Lead Generation</div>
                      <div class="rounded-xl bg-white p-3">Service: Botox Consultation</div>
                      <div class="rounded-xl bg-white p-3">Channel: Instagram + Meta Ads</div>
                      <div class="rounded-xl bg-white p-3">Estimated preview: 48h</div>
                    </div>
                    <button class="mt-4 w-full rounded-2xl bg-blue-600 px-4 py-3 text-sm font-medium text-white">Continue</button>
                  </div>
                </div>
              </div>
            </section>
          </main>
        </div>
      </div>
    `;
  </script>
</body>
</html>
